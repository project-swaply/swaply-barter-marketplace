services:
  - type: web
    name: swaply-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:migrate && pnpm server:build
    startCommand: pnpm server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swaply-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://swaply-barter-marketplace.vercel.app
databases:
  - name: swaply-db
    plan: free
    databaseName: swaply
    user: swaply
