services:
  - type: web
    name: swaply-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm server:build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swaply-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
databases:
  - name: swaply-db
    plan: free
    databaseName: swaply
    user: swaply
